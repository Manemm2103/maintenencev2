<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c"><title>Request Sent · DR HOME</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080809;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:430px;min-height:100vh;margin:auto;background:radial-gradient(circle at 50% 8%,#1d2022 0,#0e0f10 32%,#080809 72%);padding:calc(35px + env(safe-area-inset-top)) 22px 42px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.logo{width:96px;margin:0 auto 32px}.check{width:82px;height:82px;border-radius:50%;margin:0 auto 24px;display:grid;place-items:center;background:linear-gradient(145deg,#202a23,#111713);border:1px solid rgba(114,219,150,.35);box-shadow:0 0 40px rgba(114,219,150,.09)}.check svg{width:40px;stroke:#77df9b;fill:none;stroke-width:1.8}
h1{font-size:30px;margin:0 0 10px}.sub{color:#a3a6ab;font-size:14px;line-height:1.55}.card{text-align:left;background:#151619;border:1px solid #292b2f;border-radius:18px;padding:18px;margin:26px 0}.card b{display:block;font-size:15px}.card p{margin:6px 0 0;color:#9da0a5;font-size:12px;line-height:1.5}.btn{background:#fff;color:#111;border-radius:16px;padding:16px;font-weight:780;cursor:pointer}

.contact-fab{
  position:fixed;
  right:max(18px,calc((100vw - 430px)/2 + 18px));
  bottom:92px;
  z-index:30;
  width:54px;height:54px;border-radius:50%;
  background:#fff;color:#111;
  display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 14px 34px rgba(0,0,0,.38);
  cursor:pointer;
}
.contact-fab svg{width:24px;height:24px;fill:none;stroke:#111;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}


.contact-fab{
  background:#25D366!important;
  border:1px solid rgba(255,255,255,.22)!important;
  box-shadow:0 14px 34px rgba(0,0,0,.38),0 0 0 1px rgba(37,211,102,.10)!important;
}
.contact-fab svg{stroke:#fff!important;stroke-width:1.9!important}
.contact-fab:active{transform:scale(.96)}

</style><script src="auth.js"></script></head><body><main class="app">
<img class="logo" src="logo.png">
<div class="check"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.2l2.5 2.5 5.5-5.7"/></svg></div>
<h1>Request sent</h1>
<div class="sub">We received your maintenance request for<br><b>Opal Tower - Marina.</b></div>
<div class="card"><b>What happens next?</b><p>For this prototype, the appointment is now shown as confirmed on your property dashboard. In the live version, DR HOME can confirm or reschedule it from the backend.</p></div>
<div class="btn" onclick="location.href='index.html'">Back to Home</div>
</main><div class="contact-fab" onclick="location.href='https://wa.me/971555662007?text=Hello%20DR%20HOME%2C%20I%20need%20help%20with%20my%20property.'" aria-label="WhatsApp DR HOME">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-9 8.5 9.3 9.3 0 0 1-3.8-.8L3 21l1.8-4.8A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8.7 8.7c.6 2.8 2.1 4.3 4.8 5.6"/><path d="M14 14.1l1.6-.7 1.5 1.2"/></svg>
</div>
</body></html>
